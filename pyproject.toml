[project]
name = "osbb-project"
version = "0.1.0"
description = "OSBB Management System API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.6.0",
    "tabulate>=0.9.0",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
[tool.ruff.lint]
ignore = ["E501"]